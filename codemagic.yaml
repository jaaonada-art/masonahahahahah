workflows:
  macos-workflow:
    name: macOS Run
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Start Web VNC
        script: |
          brew install cloudflared
          pip3 install websockify
          git clone --depth 1 https://github.com /tmp/noVNC
          websockify --web=/tmp/noVNC 127.0.0.1:6080 127.0.0.1:5900 &
          sleep 3
          cloudflared tunnel --url http://127.0.0.1:6080
