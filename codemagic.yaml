workflows:
  macos-workflow:
    name: macOS Run
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Start Web VNC
        script: |
          brew install novnc cloudflared
          websockify --web=/opt/homebrew/share/novnc/ 6080 localhost:5900 &
          cloudflared tunnel --url http://localhost:6080
